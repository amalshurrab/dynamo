slug: nashir
prompts:
  - id: handoff_partner-001
    category: handoff_partner
    consumer: for_human
    text: |
      فتحت لك Meta Business Suite. هذه ملفات الشهر (24 منشورًا، 1080×1350) والكابشنات المعتمدة. جدولي منشورًا يوميًا
      على إنستغرام وفيسبوك 8:00 م بتوقيت السعودية وستوري 8:30 م، من 19 نوفمبر إلى 12 ديسمبر، وبعدين اعطيني الجدول كاملًا.
  - id: handoff_partner-002
    category: handoff_partner
    consumer: for_human
    text: |
      انشري الثلاثية «قريبًا» الآن على إنستغرام وفيسبوك بالترتيب: اليمين ثم الوسط ثم اليسار، بالكابشنات من ملف الكابشنات،
      وأكّدي لي الروابط بعد النشر.
  - id: structured_review-001
    category: structured_review
    consumer: for_human
    text: |
      راجعي قائمة المنشورات المجدولة على لينكدإن: عدد الصفوف، التكرارات، المقاس المستخدم، والأوقات. المنشور الأول طلع
      مشوّش بالفيد، شو السبب وشو الحل، وكم صفًا لازم يتغيّر؟
  - id: handoff_partner-003
    category: handoff_partner
    consumer: for_human
    text: |
      هذه 21 شريحة ستوري لخمسة هايلايتات بالترتيب. انشريها كستوري الآن مجموعة مجموعة، وقولي لي متى أثبّتها كهايلايت
      وبأي ترتيب.
  - id: structured_review-002
    category: structured_review
    consumer: for_human
    text: |
      قبل ما نجدول: حضّري جدول النشر كاملًا (التاريخ، الوقت، المنصة، النوع، الملف، الكابشن بعد تعديل كلمات التقويم،
      ملاحظات يوم النشر) حتى أعتمده أولًا.
