slug: rawi
prompts:
  - id: handoff_partner-001
    category: handoff_partner
    consumer: for_human
    text: |
      هذا ملف هوية المشروع. اكتبي خطة الأسبوع الأول: 6 منشورات بترتيب (كشف، مشكلة، كيف يشتغل، دليل، تعليم، عرض)،
      كابشن واحد لكل منشور لكل المنصات، كلمة مفتاحية في أول سطر، نقطة عملية مرقّمة، دعوة للتعليق أو الحفظ، 4 هاشتاقات،
      ومصادر بالاسم. اللهجة سعودية خفيفة.
  - id: structured_review-001
    category: structured_review
    consumer: for_human
    text: |
      المالك قال الكابشنات «عامة وتصلح لأي شركة». راجعي الستة وبيّني بالضبط وين الجملة العامة، واستبدليها بجملة فيها
      مصدر أو رقم أو خطوة أو مشهد من حياة الشريحة.
  - id: handoff_partner-002
    category: handoff_partner
    consumer: for_human
    text: |
      اكتبي نبذة لينكدإن (About) بالعربية ثم الإنجليزية ضمن 2000 حرف، فيها الخطّاف وكل أدوات الذكاء الاصطناعي بالاسم،
      وبدون ذكر جمهور مستهدف. وبيو إنستغرام ضمن 150 حرفًا.
  - id: handoff_partner-003
    category: handoff_partner
    consumer: for_human
    text: |
      جهّزي كاروسيل 7 شرائح «5 أسئلة يسألها المشتري قبل ما يشتري»: نص كل شريحة بسطرين، وكابشن واحد، وسؤال تصويت للستوري.
  - id: educational_explainer-001
    category: educational_explainer
    consumer: for_human
    text: |
      اكتبي 10 ردود جاهزة على أول التعليقات المتوقعة: السعر، كيف يشتغل، التجربة، «هل المحتوى مكتوب بالذكاء الاصطناعي؟»،
      «كم يطلع وقت لتبان النتيجة؟». بنفس لهجة الحساب وبدون وعود بنتائج.
